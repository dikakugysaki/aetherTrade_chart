<!DOCTYPE html>
<html>
<head>
    <title>AetherTrade AI Chart</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #1a1a2e; }
        #chart { width: 100%; height: 500px; }
        #volume { width: 100%; height: 120px; }
    </style>
</head>
<body>
    <div id="chart"></div>
    <div id="volume"></div>

    <script>
        // ===== BACA PARAMETER DARI URL =====
        const params = new URLSearchParams(window.location.search);
        const symbol = params.get('symbol') || 'XAUUSD';
        const entry = parseFloat(params.get('entry')) || 0;
        const sl = parseFloat(params.get('sl')) || 0;
        const tp1 = parseFloat(params.get('tp1')) || 0;
        const tp2 = parseFloat(params.get('tp2')) || 0;

        // ===== TAMPILKAN JUDUL =====
        document.title = `${symbol} - AetherTrade AI`;

        // ===== BUAT CHART =====
        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            width: 800,
            height: 500,
            layout: {
                background: { color: '#1a1a2e' },
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: '#2a2a3e' },
                horzLines: { color: '#2a2a3e' },
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
            },
            rightPriceScale: {
                borderColor: '#2a2a3e',
            },
            timeScale: {
                borderColor: '#2a2a3e',
                timeVisible: true,
                secondsVisible: false,
            },
        });

        // ===== BUAT VOLUME CHART =====
        const volumeSeries = chart.addHistogramSeries({
            priceFormat: { type: 'volume' },
            priceScaleId: '',
            scaleMargins: { top: 0.8, bottom: 0 },
        });

        // ===== BUAT CANDLESTICK =====
        const candleSeries = chart.addCandlestickSeries({
            upColor: '#26a69a',
            downColor: '#ef5350',
            borderDownColor: '#ef5350',
            borderUpColor: '#26a69a',
            wickDownColor: '#ef5350',
            wickUpColor: '#26a69a',
        });

        // ===== AMBIL DATA DARI BINANCE API (GRATIS) =====
        const binanceSymbol = symbol.replace('/', '').replace('XAU', 'GOLD'); // Sesuaikan
        const interval = '15m'; // 15 menit
        const limit = 100;

        fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}USDT&interval=${interval}&limit=${limit}`)
            .then(res => res.json())
            .then(data => {
                const candleData = [];
                const volumeData = [];
                
                data.forEach(d => {
                    const time = d[0] / 1000; // Convert ke detik
                    candleData.push({
                        time: time,
                        open: parseFloat(d[1]),
                        high: parseFloat(d[2]),
                        low: parseFloat(d[3]),
                        close: parseFloat(d[4])
                    });
                    volumeData.push({
                        time: time,
                        value: parseFloat(d[5]),
                        color: d[4] > d[1] ? '#26a69a44' : '#ef535044'
                    });
                });

                candleSeries.setData(candleData);
                volumeSeries.setData(volumeData);
            })
            .catch(err => {
                console.log('Pakai data dummy karena API error');
                // Data dummy kalau API gagal
                const dummy = [];
                const now = Math.floor(Date.now() / 1000);
                for (let i = 99; i >= 0; i--) {
                    const time = now - i * 900;
                    const base = 4600 + Math.random() * 100;
                    dummy.push({
                        time: time,
                        open: base,
                        high: base + 10 + Math.random() * 10,
                        low: base - 10 - Math.random() * 10,
                        close: base + Math.random() * 20 - 10
                    });
                }
                candleSeries.setData(dummy);
            });

        // ===== TAMBAH EMA 20 =====
        // (Butuh kalkulasi, skip dulu biar simpel)

        // ===== TAMBAH GARIS ENTRY (Hijau) =====
        if (entry > 0) {
            candleSeries.createPriceLine({
                price: entry,
                color: '#00ff88',
                lineWidth: 2,
                lineStyle: LightweightCharts.LineStyle.Solid,
                axisLabelVisible: true,
                title: 'ENTRY',
            });
        }

        // ===== TAMBAH GARIS TP1 (Biru) =====
        if (tp1 > 0) {
            candleSeries.createPriceLine({
                price: tp1,
                color: '#00bcd4',
                lineWidth: 2,
                lineStyle: LightweightCharts.LineStyle.Dashed,
                axisLabelVisible: true,
                title: 'TP1',
            });
        }

        // ===== TAMBAH GARIS TP2 (Ungu) =====
        if (tp2 > 0) {
            candleSeries.createPriceLine({
                price: tp2,
                color: '#9c27b0',
                lineWidth: 2,
                lineStyle: LightweightCharts.LineStyle.Dashed,
                axisLabelVisible: true,
                title: 'TP2',
            });
        }

        // ===== TAMBAH GARIS SL (Merah) =====
        if (sl > 0) {
            candleSeries.createPriceLine({
                price: sl,
                color: '#ff4444',
                lineWidth: 2,
                lineStyle: LightweightCharts.LineStyle.Solid,
                axisLabelVisible: true,
                title: 'SL',
            });
        }

        // ===== FIT CHART KE DATA =====
        chart.timeScale().fitContent();
    </script>
</body>
</html>
