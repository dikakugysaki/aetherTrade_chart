<!DOCTYPE html>
<html>
<head>
<title>AetherTrade AI</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#131722;font-family:Arial;padding:5px}
h3{color:#fff;text-align:center;margin:5px 0;font-size:14px}
#chart{width:100%;height:350px}
#rsi{width:100%;height:80px;margin-top:2px}
.leg{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:3px 0}
.leg span{font-size:10px;padding:2px 6px;border-radius:3px}
</style>
</head>
<body>
<h3 id="title">Loading...</h3>
<div class="leg">
<span style="background:#ff980044;color:#ff9800">EMA9</span>
<span style="background:#2196f344;color:#2196f3">EMA20</span>
<span style="background:#e91e6344;color:#e91e63">EMA50</span>
<span style="background:#fff3;color:#fff">BB</span>
</div>
<div id="chart"></div>
<div id="rsi"></div>
<div style="color:#666;text-align:center;font-size:10px;margin-top:5px">AetherTrade AI | EMA 9·20·50 | BB 20,2 | RSI 14</div>
<script>
const p=new URLSearchParams(location.search);
const sym=p.get('symbol')||'XAUUSD';
const entry=+p.get('entry')||0;
const sl=+p.get('sl')||0;
const tp1=+p.get('tp1')||0;
const tp2=+p.get('tp2')||0;
document.getElementById('title').innerText='📊 '+sym+' - AetherTrade AI';
document.title=sym+' - AI Signal';

const ch=LightweightCharts.createChart(document.getElementById('chart'),{
width:window.innerWidth-10,height:350,
layout:{background:{color:'#131722'},textColor:'#d1d4dc'},
grid:{vertLines:{color:'#1e222d'},horzLines:{color:'#1e222d'}},
rightPriceScale:{borderColor:'#2a2e3e'},
timeScale:{borderColor:'#2a2e3e',timeVisible:true}
});

const rsiCh=LightweightCharts.createChart(document.getElementById('rsi'),{
width:window.innerWidth-10,height:80,
layout:{background:{color:'#131722'},textColor:'#d1d4dc'},
grid:{vertLines:{color:'#1e222d'},horzLines:{color:'#1e222d'}},
rightPriceScale:{borderColor:'#2a2e3e'},
timeScale:{borderColor:'#2a2e3e',timeVisible:false}
});

const cs=ch.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderUpColor:'#26a69a',borderDownColor:'#ef5350',wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
const rsiS=rsiCh.addLineSeries({color:'#ffeb3b',lineWidth:2});

function ema(d,p){var k=2/(p+1),e=[],s=0;for(var i=0;i<p;i++)s+=d[i].close;e.push({time:d[p-1].time,value:s/p});for(var i=p;i<d.length;i++)e.push({time:d[i].time,value:d[i].close*k+e[e.length-1].value*(1-k)});return e}
function sma(d,p){var r=[];for(var i=p-1;i<d.length;i++){var s=0;for(var j=i-p+1;j<=i;j++)s+=d[j].close;r.push({time:d[i].time,value:s/p})}return r}
function bb(d,p,std){var m=sma(d,p),u=[],l=[];for(var i=0;i<m.length;i++){var idx=i+p-1,s=0;for(var j=idx-p+1;j<=idx;j++)s+=Math.pow(d[j].close-m[i].value,2);var st=Math.sqrt(s/p);u.push({time:m[i].time,value:m[i].value+std*st});l.push({time:m[i].time,value:m[i].value-std*st})}return{upper:u,lower:l,middle:m}}
function rsi(d,p){var r=[],g=0,l=0;for(var i=1;i<=p;i++){var df=d[i].close-d[i-1].close;if(df>=0)g+=df;else l-=df}var ag=g/p,al=l/p;r.push({time:d[p].time,value:al==0?100:100-(100/(1+ag/al))});for(var i=p+1;i<d.length;i++){var df=d[i].close-d[i-1].close;ag=(ag*(p-1)+(df>0?df:0))/p;al=(al*(p-1)+(df<0?-df:0))/p;r.push({time:d[i].time,value:al==0?100:100-(100/(1+ag/al))})}return r}

fetch('https://api.twelvedata.com/time_series?symbol='+sym+'&interval=15min&outputsize=120&apikey=d918e5241a1d46e09417302d53ffa7b5')
.then(r=>r.json()).then(d=>{
if(!d.values)throw new Error('No data');
var v=d.values.reverse();
var cd=v.map(x=>({time:new Date(x.datetime).getTime()/1000,open:+x.open,high:+x.high,low:+x.low,close:+x.close}));
cs.setData(cd);
[9,20,50].forEach((p,i)=>{var e=ema(cd,p);ch.addLineSeries({color:['#ff9800','#2196f3','#e91e63'][i],lineWidth:1,priceLineVisible:false}).setData(e)});
var b=bb(cd,20,2);ch.addLineSeries({color:'#fff3',lineWidth:1,priceLineVisible:false}).setData(b.upper);ch.addLineSeries({color:'#fff8',lineWidth:1,priceLineVisible:false}).setData(b.middle);ch.addLineSeries({color:'#fff3',lineWidth:1,priceLineVisible:false}).setData(b.lower);
var rs=rsi(cd,14);rsiS.setData(rs);
[70,30,50].forEach(l=>{rsiCh.addLineSeries({color:'#fff2',lineWidth:1,lastValueVisible:false,priceLineVisible:false}).setData([{time:cd[0].time,value:l},{time:cd[cd.length-1].time,value:l}])});
[{p:entry,c:'#00ff88',t:'E'},{p:tp1,c:'#00bcd4',t:'T1'},{p:tp2,c:'#2196f3',t:'T2'},{p:sl,c:'#ff4444',t:'SL'}].forEach(x=>{if(x.p>0)cs.createPriceLine({price:x.p,color:x.c,lineWidth:2,axisLabelVisible:true,title:x.t})});
ch.timeScale().fitContent();rsiCh.timeScale().fitContent();
document.getElementById('title').innerText='📊 '+sym+' - AetherTrade AI';
}).catch(e=>{document.getElementById('title').innerText='⚠️ Gagal: '+sym});
</script>
</body>
</html>
